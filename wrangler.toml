name = "drel-release-gate"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[durable_objects.bindings]]
name = "APPROVALS"
class_name = "ApprovalTicket"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ApprovalTicket"]

[[routes]]
pattern = "approve.xbrowser.dev"
custom_domain = true

[vars]
# 公开信息
REPO = "dyyz1993/xbrowser"
ENVIRONMENT = "production"

# Secrets (wrangler secret put):
# GITHUB_APP_ID
# GITHUB_APP_PRIVATE_KEY
# UI_SHARED_SECRET
# TICKET_SECRET
